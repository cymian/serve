name: Check and publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: deno ci
      - run: deno fmt --check
      - run: deno task lint
      - run: deno task check
      - run: deno task test
      - run: deno task publish:dry

  publish:
    name: Publish to JSR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          deno eval
          'const text = await Deno.readTextFile("deno.jsonc");
          const version = text.match(/^\s*"version"\s*:\s*"([^"]+)"/m)?.[1];
          const tag = Deno.env.get("RELEASE_TAG");
          if (!version || tag !== `v${version}`) {
            console.error(`Tag ${tag} does not match package version ${version}.`);
            Deno.exit(1);
          }'
      - run: deno publish
